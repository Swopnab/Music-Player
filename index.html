<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="static/style.css?v=3">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fa-solid fa-music"></i> Library
            </div>
            <ul class="song-list" id="songList">
                <!-- Songs will be injected here -->
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="now-playing-view">
                <div class="album-art-large" id="albumArtLarge">
                    <i class="fa-solid fa-compact-disc"></i>
                </div>
                <h2 id="currentTitleLarge">Select a song</h2>
            </div>
        </main>

        <!-- Player Bar -->
        <footer class="player-bar glass">
            <div class="track-info">
                <div class="track-details">
                    <span class="track-name" id="currentTitle">No Song Playing</span>
                </div>
            </div>

            <div class="player-controls">
                <div class="control-buttons">
                    <button id="prevBtn" class="control-btn"><i class="fa-solid fa-backward-step"></i></button>
                    <button id="playBtn" class="control-btn play-pause"><i class="fa-solid fa-play"></i></button>
                    <button id="nextBtn" class="control-btn"><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <div class="progress-container">
                    <span id="currentTime">0:00</span>
                    <input type="range" id="progressBar" value="0" min="0" max="100">
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="volume-container">
                <div class="volume-header">
                    <label>Volume</label>
                    <span id="volumeValue" class="volume-value">100</span>
                </div>
                <div class="volume-slider-wrapper">
                    <i class="fa-solid fa-volume-xmark volume-icon"></i>
                    <input type="range" id="volumeBar" value="100" min="0" max="100" aria-label="Volume slider">
                    <i class="fa-solid fa-volume-high volume-icon"></i>
                </div>
            </div>
        </footer>

        <!-- Hidden Audio Element -->
        <audio id="audioPlayer"></audio>
    </div>

    <script src="static/app.js?v=3"></script>
</body>

</html>
